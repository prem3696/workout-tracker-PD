<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Log</title>
<style>
  :root{
    --bg:#0d0f0d;
    --card:#16191670;
    --card-solid:#161916;
    --line:#2a2e29;
    --lime:#c8f31d;
    --lime-dim:#c8f31d33;
    --text:#eef0ea;
    --sub:#8b9188;
    --danger:#ff5d5d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    padding-bottom:100px;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(13,15,13,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:16px 18px 14px;
  }
  .h-top{display:flex; justify-content:space-between; align-items:baseline;}
  h1{font-size:22px; margin:0; letter-spacing:-0.02em; font-weight:800;}
  .date{color:var(--sub); font-size:13px; margin-top:2px;}
  .stats{display:flex; gap:18px; margin-top:12px;}
  .stat{font-size:12px; color:var(--sub);}
  .stat b{display:block; color:var(--lime); font-size:17px; font-weight:800; font-variant-numeric:tabular-nums;}
  .progress-track{height:4px; background:var(--line); border-radius:2px; margin-top:12px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--lime); width:0%; transition:width .3s ease;}

  .rest-bar{
    position:fixed; left:14px; right:14px; bottom:calc(100px + env(safe-area-inset-bottom));
    background:var(--card-solid); border:1px solid var(--lime); border-radius:16px;
    padding:12px 14px; display:none; align-items:center; gap:12px; z-index:20;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  .rest-bar.show{display:flex;}
  .rest-ring{
    width:46px; height:46px; border-radius:50%; flex-shrink:0; position:relative;
    display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--lime) calc(var(--pct,0) * 1%), var(--line) 0);
  }
  .rest-ring::after{
    content:''; position:absolute; width:36px; height:36px; border-radius:50%; background:var(--card-solid);
  }
  .rest-ring span{position:relative; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums;}
  .rest-info{flex:1; min-width:0;}
  .rest-label{font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--sub); font-weight:700;}
  .rest-name{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rest-actions{display:flex; gap:6px; flex-shrink:0;}
  .rest-actions button{
    background:#20241f; border:1px solid var(--line); color:var(--text);
    font-size:11px; font-weight:700; padding:7px 9px; border-radius:8px; cursor:pointer;
  }
  .rest-actions button.skip{color:var(--danger); border-color:#3a2222;}

  main{padding:14px;}
  .block-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.14em;
    color:var(--lime); font-weight:700; margin:22px 4px 8px;
  }
  .block-label:first-child{margin-top:6px;}

  .ex-card{
    background:var(--card-solid); border:1px solid var(--line);
    border-radius:14px; margin-bottom:10px; overflow:hidden;
  }
  .ex-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 14px 10px;
  }
  .ex-name{font-size:15.5px; font-weight:700; letter-spacing:-0.01em;}
  .ex-meta{font-size:12px; color:var(--sub); margin-top:3px;}
  .vid-btn{
    width:34px; height:34px; border-radius:9px; background:#20241f;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    flex-shrink:0; text-decoration:none; margin-left:10px; cursor:pointer;
  }
  .vid-btn svg{width:14px; height:14px; fill:var(--lime);}
  .vid-btn.open{background:var(--lime); border-color:var(--lime);}
  .vid-btn.open svg{fill:#0d0f0d;}

  .vid-embed{
    display:none; padding:0 14px 12px;
  }
  .vid-embed.show{display:block;}
  .vid-embed .frame-wrap{
    position:relative; width:100%; padding-top:177.7%; /* 9:16 shorts */
    max-width:220px; margin:0 auto; border-radius:12px; overflow:hidden;
    background:#000; border:1px solid var(--line);
  }
  .vid-embed iframe{
    position:absolute; top:0; left:0; width:100%; height:100%; border:0;
  }
  .vid-fallback{
    display:block; text-align:center; margin-top:8px; font-size:11.5px;
    color:var(--lime); text-decoration:none;
  }

  .sets{padding:0 14px 12px;}
  .set-row{
    display:grid; grid-template-columns:26px 1fr 1fr 1fr 34px;
    gap:8px; align-items:center; padding:7px 0;
    border-top:1px solid var(--line);
  }
  .set-row:first-child{border-top:none;}
  .set-idx{color:var(--sub); font-size:12px; font-weight:700; text-align:center;}
  .set-row input[type=text], .set-row input[type=number]{
    width:100%; background:#1d201c; border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-size:13px; padding:7px 6px; text-align:center;
    font-variant-numeric:tabular-nums; font-family:inherit;
  }
  .set-row input:focus{outline:none; border-color:var(--lime);}
  .colhead{font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:0.06em; text-align:center;}
  .check{
    width:28px; height:28px; border-radius:8px; border:1.5px solid var(--line);
    background:#1d201c; display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:all .15s ease;
  }
  .check svg{width:14px; height:14px; stroke:var(--bg); fill:none; stroke-width:3; opacity:0;}
  .check.done{background:var(--lime); border-color:var(--lime);}
  .check.done svg{opacity:1;}
  .set-row.done input{opacity:0.45;}

  .note{padding:2px 14px 12px; font-size:11.5px; color:var(--sub); font-style:italic;}

  .add-set{
    margin:0 14px 14px; padding:9px; text-align:center; font-size:12.5px;
    color:var(--lime); background:var(--lime-dim); border:1px dashed var(--lime);
    border-radius:9px; cursor:pointer; font-weight:600;
  }

  footer{
    position:fixed; bottom:0; left:0; right:0;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .finish-btn{
    width:100%; background:var(--lime); color:#0d0f0d; border:none;
    padding:15px; border-radius:14px; font-size:15px; font-weight:800;
    letter-spacing:-0.01em; cursor:pointer;
  }
  .finish-btn:active{transform:scale(0.98);}
  .reset-btn{
    width:100%; background:transparent; color:var(--sub); border:1px solid var(--line);
    padding:10px; border-radius:12px; font-size:12.5px; font-weight:600;
    cursor:pointer; margin-top:8px;
  }
  .saved-msg{
    text-align:center; font-size:12px; color:var(--lime); margin-top:8px; height:14px;
  }
</style>
</head>
<body>

<header>
  <div class="h-top">
    <div>
      <h1>Session Log</h1>
      <div class="date" id="dateLabel"></div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="statClock">0:00</b>elapsed</div>
    <div class="stat"><b id="statSets">0/0</b>sets done</div>
    <div class="stat"><b id="statVolume">0</b>kg volume</div>
    <div class="stat"><b id="statExercises">0</b>exercises</div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
</header>

<main id="main"></main>

<div class="rest-bar" id="restBar">
  <div class="rest-ring" id="restRing"><span id="restTime">0:00</span></div>
  <div class="rest-info">
    <div class="rest-label">Resting</div>
    <div class="rest-name" id="restName">—</div>
  </div>
  <div class="rest-actions">
    <button id="restMinus">-15</button>
    <button id="restPlus">+15</button>
    <button class="skip" id="restSkip">Skip</button>
  </div>
</div>

<footer>
  <button class="finish-btn" id="finishBtn">Finish Session</button>
  <button class="reset-btn" id="resetBtn">Start New Workout (clear saved data)</button>
  <div class="saved-msg" id="savedMsg"></div>
</footer>

<script>
const DATA = [
  { block:"Prehab", exercises:[
    { name:"EXT Rotation Iso Hold", meta:"30 sec hold", video:"https://youtube.com/shorts/TLCU1PZ4IZM", rest:20, sets:[
      {reps:"30s",weight:"BW"}
    ]},
    { name:"Seated DB EXT Rotation", meta:"5 reps / side @ 7.5kg", video:"https://youtube.com/shorts/Y75jNwvXwBg", rest:20, sets:[
      {reps:"5/side",weight:"7.5"}
    ]},
    { name:"IYT Raises", meta:"5x3 @ RPE 6 (5kg)", video:"https://youtube.com/shorts/6tpq1F-WRkI", rest:30, sets:[
      {reps:"5",weight:"5"},{reps:"5",weight:"5"},{reps:"5",weight:"5"}
    ]},
    { name:"Lu Raises", meta:"10 reps", video:"https://youtube.com/shorts/oZgHeEFY8pc", rest:20, sets:[
      {reps:"10",weight:""}
    ]},
  ]},
  { block:"Max Effort", exercises:[
    { name:"A1 · Muscle Clean", meta:"8-10 reps x 3 @ 30-40kg", video:"https://youtube.com/shorts/p79aqHMzlBw", rest:120, sets:[
      {reps:"8-10",weight:"30-40"},{reps:"8-10",weight:"30-40"},{reps:"8-10",weight:"30-40"}
    ]},
    { name:"A2 · Front Rack Pin Push Press", meta:"6x3 @ 30-40kg", video:"https://youtube.com/shorts/G98Z39xu8c8", rest:120, sets:[
      {reps:"6",weight:"30-40"},{reps:"6",weight:"30-40"},{reps:"6",weight:"30-40"}
    ]},
    { name:"B1 · Block Deadlift", meta:"RPE 7-8, ramping", video:"https://youtube.com/shorts/hWbUlkb5Ms4", rest:180, sets:[
      {reps:"6",weight:"80"},
      {reps:"5",weight:"100"},{reps:"5",weight:"100"},
      {reps:"5",weight:"120"},{reps:"5",weight:"120"}
    ]},
    { name:"C1 · Bench Press", meta:"RPE 10, ramping", video:"", rest:180, sets:[
      {reps:"6-8",weight:"30"},{reps:"6-8",weight:"30"},
      {reps:"2-4",weight:"40"},{reps:"2-4",weight:"40"},
      {reps:"1",weight:"45"},{reps:"1",weight:"45"},
      {reps:"1",weight:"50"},{reps:"1",weight:"50"}
    ]},
  ]},
  { block:"Accessories", exercises:[
    { name:"B2 · SA DB Row", meta:"8/side x 2 @ max out", video:"https://youtube.com/shorts/ACLHEJYVtJo", rest:75, sets:[
      {reps:"8/side",weight:"max"},{reps:"8/side",weight:"max"}
    ]},
    { name:"B3 · DB Rows", meta:"8x1 @ 10-20% below B2", video:"https://youtu.be/6gvmcqr226U", rest:60, sets:[
      {reps:"8",weight:""}
    ]},
    { name:"B4 · Chin Ups", meta:"2 sets to failure", video:"https://youtube.com/shorts/Oi3bW9nQmGI", rest:90, sets:[
      {reps:"AMRAP",weight:"BW"},{reps:"AMRAP",weight:"BW"}
    ]},
    { name:"C2 · Incline 1-1-2 Press", meta:"8x3 @ 12-15kg", video:"https://youtu.be/bVMjUler4_w", rest:60, sets:[
      {reps:"8",weight:"12-15"},{reps:"8",weight:"12-15"},{reps:"8",weight:"12-15"}
    ]},
    { name:"C3 · Flat DB Press", meta:"6x2 @ 15-20kg", video:"https://youtube.com/shorts/Ne_9EKkUVXY", rest:60, sets:[
      {reps:"6",weight:"15-20"},{reps:"6",weight:"15-20"}
    ]},
    { name:"C4 · Tri Extension", meta:"10x3 @ 20-40kg", video:"https://youtube.com/shorts/9Ark9S11uXw", rest:45, sets:[
      {reps:"10",weight:"20-40"},{reps:"10",weight:"20-40"},{reps:"10",weight:"20-40"}
    ]},
  ]},
];

const STORAGE_KEY = "session_log_state_v1";
let state = null;

function buildInitialState(){
  return {
    workoutStart: Date.now(),
    blocks: DATA.map(block => ({
      block: block.block,
      exercises: block.exercises.map(ex => ({
        name: ex.name, meta: ex.meta, video: ex.video, rest: ex.rest || 60,
        sets: ex.sets.map(s => ({ weight: s.weight, reps: s.reps, done: false }))
      }))
    }))
  };
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)){
        // old format from before timers existed — migrate
        return { workoutStart: Date.now(), blocks: parsed };
      }
      if(parsed && parsed.blocks) return parsed;
    }
  }catch(e){}
  return buildInitialState();
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function extractYouTubeId(url){
  const m = url.match(/(?:shorts\/|v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function checkIcon(){
  return '<svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"></polyline></svg>';
}
function vidIcon(){
  return '<svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>';
}

function render(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  state.blocks.forEach((block, bi) => {
    const label = document.createElement('div');
    label.className = 'block-label';
    label.textContent = block.block;
    main.appendChild(label);

    block.exercises.forEach((ex, ei) => {
      const card = document.createElement('div');
      card.className = 'ex-card';

      const head = document.createElement('div');
      head.className = 'ex-head';
      head.innerHTML = `
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-meta">${ex.meta} · rest ${formatTime(ex.rest)}</div>
        </div>
        ${ex.video ? `<div class="vid-btn" data-role="vidtoggle">${vidIcon()}</div>` : ''}
      `;
      card.appendChild(head);

      if(ex.video){
        const embedWrap = document.createElement('div');
        embedWrap.className = 'vid-embed';
        embedWrap.innerHTML = `<div class="frame-wrap"></div>`;
        card.appendChild(embedWrap);

        head.querySelector('[data-role=vidtoggle]').addEventListener('click', (e) => {
          const btn = e.currentTarget;
          const isOpen = embedWrap.classList.toggle('show');
          btn.classList.toggle('open', isOpen);
          const frameWrap = embedWrap.querySelector('.frame-wrap');
          if(isOpen){
            const id = extractYouTubeId(ex.video);
            frameWrap.innerHTML = id
              ? `<iframe src="https://www.youtube.com/embed/${id}?playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
              : '';
            let fallback = embedWrap.querySelector('.vid-fallback');
            if(!fallback){
              fallback = document.createElement('a');
              fallback.className = 'vid-fallback';
              fallback.target = '_blank';
              fallback.rel = 'noopener';
              fallback.textContent = "Video not loading? Watch on YouTube ↗";
              embedWrap.appendChild(fallback);
            }
            fallback.href = ex.video;
          } else {
            frameWrap.innerHTML = '';
          }
        });
      }

      const setsWrap = document.createElement('div');
      setsWrap.className = 'sets';

      const colHead = document.createElement('div');
      colHead.className = 'set-row';
      colHead.innerHTML = `<div></div><div class="colhead">Weight</div><div class="colhead">Reps</div><div class="colhead">Notes</div><div></div>`;
      setsWrap.appendChild(colHead);

      ex.sets.forEach((s, si) => {
        const row = document.createElement('div');
        row.className = 'set-row' + (s.done ? ' done' : '');
        row.innerHTML = `
          <div class="set-idx">${si+1}</div>
          <input type="text" value="${s.weight}" data-field="weight" placeholder="kg">
          <input type="text" value="${s.reps}" data-field="reps" placeholder="reps">
          <input type="text" value="${s.rpe||''}" data-field="rpe" placeholder="RPE">
          <div class="check ${s.done?'done':''}" data-role="check">${checkIcon()}</div>
        `;
        row.querySelectorAll('input').forEach(inp => {
          inp.addEventListener('input', e => {
            s[e.target.dataset.field] = e.target.value;
            save();
          });
        });
        row.querySelector('[data-role=check]').addEventListener('click', () => {
          const wasDone = s.done;
          s.done = !s.done;
          save();
          render();
          if(!wasDone && s.done){
            startRest(ex.rest, ex.name);
          }
        });
        setsWrap.appendChild(row);
      });

      card.appendChild(setsWrap);

      const addBtn = document.createElement('div');
      addBtn.className = 'add-set';
      addBtn.textContent = '+ Add Set';
      addBtn.addEventListener('click', () => {
        const last = ex.sets[ex.sets.length-1] || {weight:'',reps:''};
        ex.sets.push({weight:last.weight, reps:last.reps, done:false});
        save(); render();
      });
      card.appendChild(addBtn);

      main.appendChild(card);
    });
  });
  updateStats();
}

function updateStats(){
  let totalSets=0, doneSets=0, volume=0, exCount=0;
  state.blocks.forEach(block => {
    block.exercises.forEach(ex => {
      exCount++;
      ex.sets.forEach(s => {
        totalSets++;
        if(s.done){
          doneSets++;
          const w = parseFloat(s.weight);
          const r = parseFloat(s.reps);
          if(!isNaN(w) && !isNaN(r)) volume += w*r;
        }
      });
    });
  });
  document.getElementById('statSets').textContent = `${doneSets}/${totalSets}`;
  document.getElementById('statVolume').textContent = volume.toLocaleString();
  document.getElementById('statExercises').textContent = exCount;
  document.getElementById('progressFill').style.width = totalSets ? `${(doneSets/totalSets)*100}%` : '0%';
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

// ---- Workout clock ----
function tickClock(){
  const elapsed = Math.floor((Date.now() - state.workoutStart)/1000);
  document.getElementById('statClock').textContent = formatTime(elapsed);
}
setInterval(tickClock, 1000);

// ---- Rest timer ----
let restTotal = 0, restRemaining = 0, restInterval = null;

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(); osc.stop(ctx.currentTime + 0.4);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,80,200]);
}

function updateRestUI(){
  const pct = restTotal ? ((restTotal-restRemaining)/restTotal)*100 : 0;
  document.getElementById('restRing').style.setProperty('--pct', pct);
  document.getElementById('restTime').textContent = formatTime(restRemaining);
}

function startRest(seconds, name){
  clearInterval(restInterval);
  restTotal = seconds;
  restRemaining = seconds;
  document.getElementById('restName').textContent = name;
  document.getElementById('restBar').classList.add('show');
  updateRestUI();
  restInterval = setInterval(() => {
    restRemaining--;
    if(restRemaining <= 0){
      restRemaining = 0;
      updateRestUI();
      clearInterval(restInterval);
      beep();
      setTimeout(stopRest, 1500);
      return;
    }
    updateRestUI();
  }, 1000);
}

function stopRest(){
  clearInterval(restInterval);
  document.getElementById('restBar').classList.remove('show');
}

document.getElementById('restSkip').addEventListener('click', stopRest);
document.getElementById('restPlus').addEventListener('click', () => {
  restRemaining += 15; restTotal += 15; updateRestUI();
});
document.getElementById('restMinus').addEventListener('click', () => {
  restRemaining = Math.max(0, restRemaining - 15); updateRestUI();
});

document.getElementById('dateLabel').textContent = new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});

state = load();
render();
tickClock();

document.getElementById('finishBtn').addEventListener('click', () => {
  save();
  const msg = document.getElementById('savedMsg');
  msg.textContent = 'Session saved ✓';
  setTimeout(()=> msg.textContent = '', 2000);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('Clear saved progress and reload this workout fresh?')){
    localStorage.removeItem(STORAGE_KEY);
    stopRest();
    state = buildInitialState();
    save();
    render();
  }
});

</script>
</body>
</html>
